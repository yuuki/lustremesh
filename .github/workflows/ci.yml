name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so that fuzzing runs longer, the timing-sensitive tests are
  # repeated, and new toolchain or zizmor findings show up between pull
  # requests.
  schedule:
    - cron: "37 14 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  # The tests need neither root nor Lustre: they run against fake parameter
  # trees and start real worker processes, which they block on FIFOs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      # The probes are Linux only; the rest must keep building elsewhere.
      - name: Vet for macOS
        run: GOOS=darwin go vet ./...

      - name: Test with race detector
        run: make test-race

  # The watchdog, the locks and the supervisor depend on timing: repeat their
  # tests, as AGENTS.md asks before a pull request that touches them.
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRESS_COUNT: ${{ github.event_name == 'schedule' && '20' || '5' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Repeat the timing-sensitive tests ${{ env.STRESS_COUNT }} times
        run: make test-stress

  fuzz:
    runs-on: ubuntu-latest
    # 2 targets: under a minute at 15s each, about 6 at 3m each.
    timeout-minutes: 20
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz every target for ${{ env.FUZZTIME }}
        run: make test-fuzz

      # A failing input is written to testdata/fuzz/<FuzzTarget>/; keep it, so
      # that it can be reproduced and committed as a regression seed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # actionlint runs with go run, at the version pinned in the Makefile.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint, zizmor and the action pins
        run: make lint-actions
        env:
          # Lets zizmor run its online audits (e.g. known-vulnerable actions)
          # and gh-actions-lock verify each pin upstream.
          GH_TOKEN: ${{ github.token }}
